name: iOS build and screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS-18' in k for x in v if x['name']=='iPhone 16 Pro'))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run UI tests
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          xcodebuild test -project StarWars.xcodeproj -scheme StarWars \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:StarWarsUITests/ScreenshotTests \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
